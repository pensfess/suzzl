<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>suzzl — coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12130f;
    --paper: #eee7d8;
    --moss: #4a5a3a;
    --clay: #a8532b;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 6vh 6vw;
    overflow: hidden;
    position: relative;
  }
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.06;
    background-image: radial-gradient(circle, var(--paper) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  .wrap {
    max-width: 640px;
    width: 100%;
    text-align: left;
  }
  .mark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(3.5rem, 14vw, 6.5rem);
    line-height: 0.9;
    margin: 0 0 0.3em 0;
    color: var(--clay);
    letter-spacing: -0.01em;
  }
  .line {
    width: 48px;
    height: 2px;
    background: var(--moss);
    margin: 0 0 1.6em 0;
  }
  p.tag {
    font-size: clamp(1.05rem, 3vw, 1.3rem);
    line-height: 1.55;
    max-width: 30ch;
    color: var(--paper);
    opacity: 0.88;
    margin: 0 0 2.2em 0;
    font-weight: 400;
  }
  .footer {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.8em 1.4em;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    color: var(--paper);
    opacity: 0.55;
  }
  .footer a {
    color: var(--moss);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }
  .footer a:hover, .footer a:focus-visible {
    border-color: var(--moss);
  }
  @media (prefers-reduced-motion: no-preference) {
    .mark { animation: rise 0.9s cubic-bezier(.2,.7,.3,1) both; }
    p.tag, .line, .footer { animation: rise 0.9s cubic-bezier(.2,.7,.3,1) both 0.12s; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="wrap">
    <h1 class="mark">suzz<span>l</span>.</h1>
    <div class="line"></div>
    <p class="tag">Lagi disiapin di dapur. Nggak lama lagi kelar dan siap disajikan.</p>
    <div class="footer">
      <span>suzzl.com</span>
      <a href="mailto:hi@suzzl.com">hi@suzzl.com</a>
    </div>
  </div>
</body>
</html>
